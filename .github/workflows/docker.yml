name: CD - Docker (GHCR)

on:
  push:
    branches: [ dev, main, mestre ]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixando o codigo
        uses: actions/checkout@v4

      - name: Configurando JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Gerando o JAR (Maven Build)
        run: mvn clean package -DskipTests 

      - name: Configurante Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construindo e publicando a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile # Verifique se o seu arquivo chama Dockerfile ou dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sistem_mayfair:latest
            ghcr.io/${{ github.repository_owner }}/sistem_mayfair:${{ github.sha }}
